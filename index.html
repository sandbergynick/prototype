<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Exo+2:wght@600;800;900&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Frutiger Aero arena: bright sky behind near-opaque glossy cards; type colour + icon carry classification */
  --sky-top: #3f9bf0; --sky-mid: #a9dcff; --grass: #8fdc6a;
  --panel: rgba(255,255,255,.80); --card: #ffffff; --edge: #ffffff; --line: #d6e3f2;
  --ink: #0f2747; --ink-soft: #4a6385; --ink-faint: #7d93b0; --accent: #0a7cff;
  --pl: #f04e37; --pl-bg: #fff1ec; --sp: #d99a00; --sp-bg: #fff8dc; --st: #5f6f86; --st-bg: #eef2f7; --aq: #0596c0; --aq-bg: #e6f8fd;
  --ne: #6b6f7a; --ne-bg: #f3f1ec; --part: #13315c; --play: #7b3fe4; --battery: #8a97a8;
  --hp: #2fbf66; --hp-low: #f04e37; --danger: #e5484d;
  --display: "Exo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--body); font-size: 15px; color: var(--ink);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 60%, #dff5ff 72%, var(--grass) 73%, #5cbf55 100%) fixed; min-height: 100%; }
.app { max-width: 1240px; margin: 0 auto; padding: 12px 16px 28px; display: grid; gap: 12px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: .08em; color: #fff; text-shadow: 0 2px 0 rgba(10,60,140,.35); }
.turnpill { font-family: var(--display); font-weight: 800; font-size: 16px; padding: 7px 16px; border-radius: 999px; background: #fff; color: var(--ink-soft); box-shadow: 0 2px 10px rgba(0,40,100,.15); }
.turnpill.me { color: #fff; background: linear-gradient(180deg, #4aa8ff, #0a7cff); }
.spacer { flex: 1; }
button { font-family: var(--body); font-weight: 800; font-size: 14px; color: var(--ink); cursor: pointer; border: 1px solid #fff; border-radius: 12px; padding: 9px 14px;
  background: linear-gradient(180deg, #ffffff 0%, #eaf4ff 50%, #d6eaff 51%, #eef7ff 100%); box-shadow: 0 2px 6px rgba(0,50,120,.18), inset 0 1px 0 #fff; }
button:hover:not(:disabled) { filter: brightness(1.04); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, .card:focus-visible, .base:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { color: #fff; background: linear-gradient(180deg, #5fb4ff 0%, #2f8cff 50%, #1a74f0 51%, #3d9bff 100%); border-color: #9fd0ff; }
.panel { background: var(--panel); border: 1px solid #fff; border-radius: 20px; box-shadow: 0 6px 24px rgba(0,50,120,.14); backdrop-filter: blur(10px); }
.side { padding: 12px 14px 14px; display: grid; gap: 10px; }
.sidehead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sidehead h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .06em; }
.sidehead .sub { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.formation { display: grid; grid-template-columns: 1fr 1.18fr 1fr; gap: 12px; align-items: stretch; }
/* type icon + badge */
.ti { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; fill: currentColor; }
.tbadge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; letter-spacing: .08em; padding: 3px 8px 3px 6px; border-radius: 999px; color: #fff; }
.tb-pl { background: var(--pl); } .tb-sp { background: var(--sp); } .tb-st { background: var(--st); } .tb-aq { background: var(--aq); } .tb-ne { background: var(--ne); }
.lbl { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--ink-faint); text-transform: uppercase; }
/* ---------- BASE cards ---------- */
.base { position: relative; display: grid; grid-template-columns: 72px 1fr; gap: 10px; padding: 12px; border-radius: 18px; background: var(--card); border: 2px solid var(--line);
  box-shadow: 0 3px 12px rgba(0,50,120,.12); transition: transform .15s, box-shadow .15s; }
.base.front { border-color: var(--accent); box-shadow: 0 6px 22px rgba(10,124,255,.22); }
.postag { position: absolute; top: -11px; left: 14px; font-size: 11px; font-weight: 800; letter-spacing: .12em; padding: 3px 10px; border-radius: 999px; background: #fff; color: var(--ink-soft); border: 2px solid var(--line); }
.front .postag { background: var(--accent); border-color: var(--accent); color: #fff; }
.base .art { width: 72px; height: 120px; image-rendering: pixelated; align-self: start; margin-top: 6px; filter: drop-shadow(0 4px 3px rgba(0,40,90,.25)); }
.op .base .art { transform: scaleX(-1); }
.bhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bname { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .05em; line-height: 1; }
.hprow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.hpnum { font-family: var(--display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; min-width: 54px; }
.hpnum small { font-size: 13px; color: var(--ink-faint); }
.hp { flex: 1; height: 10px; border-radius: 999px; background: #e3ebf5; overflow: hidden; }
.hp i { display: block; height: 100%; background: linear-gradient(180deg, #6ee39a, var(--hp)); border-radius: 999px; transition: width .35s; }
.hp.low i { background: linear-gradient(180deg, #ff9a8f, var(--hp-low)); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; margin-top: 8px; font-size: 13px; align-items: center; }
.slots { display: flex; gap: 3px; }
.slots i { width: 13px; height: 13px; border-radius: 4px; border: 2px solid var(--line); }
.slots i.on { background: var(--ink-soft); border-color: var(--ink-soft); }
.ability { margin-top: 8px; padding: 7px 9px; border-radius: 10px; background: #f3f7fc; font-size: 12.5px; line-height: 1.4; }
.ability .tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .1em; padding: 1px 6px; border-radius: 6px; margin-right: 4px; color: #fff; background: var(--ink-soft); }
.ability .tag.FRONT { background: var(--accent); } .ability .tag.SUPPORT { background: #2a9d68; } .ability .tag.ALWAYS { background: #7b3fe4; }
.ability .off { opacity: .5; }
.parts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.part { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 8px; }
.part.ne { background: var(--ne-bg); color: var(--ne); } .part.pl { background: var(--pl-bg); color: var(--pl); } .part.sp { background: var(--sp-bg); color: #9a6c00; } .part.st { background: var(--st-bg); color: var(--st); } .part.aq { background: var(--aq-bg); color: #047395; }
.status { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.status span { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; padding: 3px 7px; border-radius: 7px; color: #fff; }
.s-scorch { background: var(--pl); } .s-cool { background: var(--aq); } .s-rot { background: #7a5cff; } .s-shield { background: #3a7bd5; }
.moves { display: grid; gap: 6px; margin-top: 10px; }
.moves .lbl { margin-bottom: -2px; }
.moves button { padding: 8px 10px; font-size: 14px; text-align: left; border-radius: 11px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.moves button b { font-family: var(--display); font-size: 15px; }
.moves button small { grid-column: 1; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.moves button .cost { grid-row: 1 / span 2; grid-column: 2; }
.note { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.down { display: grid; place-items: center; min-height: 170px; border-radius: 18px; border: 2px dashed rgba(255,255,255,.95); color: rgba(15,39,71,.45); font-weight: 800; font-family: var(--display); letter-spacing: .1em; background: rgba(255,255,255,.3); }
.target { cursor: pointer; border-color: var(--accent) !important; box-shadow: 0 0 0 4px rgba(10,124,255,.35), 0 10px 26px rgba(10,124,255,.4) !important; transform: translateY(-3px); }
.target::after { content: "Tap to choose"; position: absolute; right: 12px; top: -11px; font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 3px 9px; border-radius: 999px; background: #ffd23f; color: var(--ink); }
.pop { position: absolute; top: 30%; left: 30px; font-family: var(--display); font-weight: 800; font-size: 32px; color: #fff; -webkit-text-stroke: 1.5px var(--danger); text-shadow: 0 2px 6px rgba(229,72,77,.6); pointer-events: none; animation: pop 1s ease-out forwards; }
@keyframes pop { 0% { transform: translateY(6px) scale(.6); opacity: 0; } 20% { transform: translateY(0) scale(1.15); opacity: 1; } 100% { transform: translateY(-26px) scale(1); opacity: 0; } }
@keyframes shake { 0%,100% { translate: 0 } 25% { translate: -4px 0 } 75% { translate: 4px 0 } }
.hit { animation: shake .3s 2; }
/* ---------- middle strip ---------- */
.mid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; }
.log { padding: 12px 14px; height: 170px; overflow-y: auto; font-size: 13.5px; line-height: 1.5; display: flex; flex-direction: column; gap: 2px; }
.log div { color: var(--ink-soft); }
.log .who-you { color: var(--accent); font-weight: 800; } .log .who-ai { color: #b23c8a; font-weight: 800; }
.log .hitline { color: #c0392b; font-weight: 800; } .log .downline { color: var(--danger); font-weight: 800; }
.log .warn { color: #a86500; font-weight: 800; } .log .sys { color: var(--ink); font-weight: 800; font-family: var(--display); letter-spacing: .04em; margin-top: 4px; }
.ctrl { padding: 12px 14px; display: grid; gap: 10px; align-content: start; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.step { padding: 6px 8px; border-radius: 10px; background: #f1f6fc; font-size: 12px; font-weight: 700; color: var(--ink-soft); line-height: 1.3; }
.step b { display: block; font-family: var(--display); font-size: 13px; color: var(--ink); }
.step.done { opacity: .5; }
.pool { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.pip { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.45); }
.pip .ti { width: 12px; height: 12px; }
.pip.ne { background: linear-gradient(180deg,#d9dbe0,#9da2ad); } .pip.pl { background: var(--pl); } .pip.sp { background: var(--sp); } .pip.st { background: var(--st); } .pip.aq { background: var(--aq); }
.pip.any { background: #a9b6c7; font-size: 12px; font-weight: 800; }
.pip.free { background: #d6dfea; color: var(--ink-soft); font-size: 10px; font-weight: 800; width: auto; padding: 0 7px; border-radius: 999px; box-shadow: none; }
.pip.sm { width: 19px; height: 19px; } .pip.sm .ti { width: 11px; height: 11px; }
.cost { display: inline-flex; gap: 3px; align-items: center; }
.hint { font-size: 15px; font-weight: 800; color: var(--ink); line-height: 1.35; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
/* ---------- hand cards ---------- */
.hand { display: flex; gap: 10px; overflow-x: auto; padding: 8px 2px 10px; }
.card { position: relative; flex: 0 0 172px; min-height: 214px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); box-shadow: 0 3px 10px rgba(0,50,120,.14);
  cursor: pointer; display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden; transition: transform .12s; }
.card:hover { transform: translateY(-4px); }
.card.sel { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,124,255,.35), 0 12px 24px rgba(10,124,255,.3); }
.chead { display: flex; align-items: center; gap: 5px; padding: 6px 9px; font-size: 11px; font-weight: 800; letter-spacing: .1em; color: #fff; }
.t-ne .chead { background: linear-gradient(90deg,#8a8f9b,#b9bcc5); } .t-pl .chead { background: var(--pl); } .t-sp .chead { background: var(--sp); } .t-st .chead { background: var(--st); } .t-aq .chead { background: var(--aq); }
.chead .kind { margin-left: auto; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.95); }
.kind.PART { color: var(--part); } .kind.PLAY { color: var(--play); } .kind.BATTERY { color: var(--battery); }
.cname { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.12; padding: 8px 10px 2px; text-wrap: balance; }
.cbody { padding: 4px 10px; display: grid; gap: 6px; align-content: start; font-size: 13px; line-height: 1.35; }
.mvbox { border-radius: 10px; padding: 6px 8px; display: grid; gap: 3px; }
.t-ne .mvbox { background: var(--ne-bg); } .t-pl .mvbox { background: var(--pl-bg); } .t-sp .mvbox { background: var(--sp-bg); } .t-st .mvbox { background: var(--st-bg); } .t-aq .mvbox { background: var(--aq-bg); }
.mvtop { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.mvtop b { font-family: var(--display); font-size: 15px; }
.sync { display: inline-flex; align-items: center; gap: 3px; font-family: var(--display); font-weight: 800; font-size: 15px; padding: 1px 7px; border-radius: 8px; color: #fff; }
.sync .ti { width: 12px; height: 12px; }
.sync.pl { background: var(--pl); } .sync.sp { background: var(--sp); } .sync.st { background: var(--st); } .sync.aq { background: var(--aq); }
.dmgline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.synctag { font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 1px 6px; border-radius: 6px; color: #fff; margin-left: 4px; }
.picklist { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; }
.picklist button.on { color: #fff; background: var(--accent); border-color: var(--accent); }
.fxchip { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: #fff; margin-right: 3px; }
.cfoot { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 10px; border-top: 1px solid var(--line); background: #f8fbfe; }
.qburn { padding: 4px 8px; font-size: 12px; border-radius: 8px; white-space: nowrap; }
.burnchip { white-space: nowrap; font-size: 11.5px; font-weight: 800; padding: 3px 7px; border-radius: 7px; background: #fff; border: 1px solid var(--line); color: var(--ink-soft); }
.opcards { display: inline-flex; gap: 4px; vertical-align: middle; }
.opcards i { width: 15px; height: 21px; border-radius: 4px; background: linear-gradient(135deg, #2f8cff, #8fd3ff); border: 1px solid #fff; box-shadow: 0 1px 3px rgba(0,40,100,.3); }
/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(20,70,140,.35); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
html, body { overscroll-behavior: none; }
body:has(#overlay .overlay), body:has(.app.game) { overflow: hidden; }
.modal { max-width: 800px; width: 100%; padding: 22px; display: grid; gap: 14px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: #fff; }
@media (max-width: 820px) {
  .overlay { place-items: start center; padding: 10px 8px calc(16px + env(safe-area-inset-bottom)); }
  .modal { max-height: none; overflow: visible; padding: 16px; margin: auto 0; }
}
.modal h2 { font-family: var(--display); font-weight: 800; margin: 0; font-size: 26px; letter-spacing: .03em; text-wrap: balance; }
.modal p { margin: 0; line-height: 1.5; max-width: 65ch; }
.decks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.deckpick { text-align: left; display: grid; gap: 8px; padding: 14px; border-radius: 16px; }
.deckpick .arts { display: flex; gap: 4px; }
.deckpick img { width: 48px; height: 80px; image-rendering: pixelated; }
.deckpick strong { font-family: var(--display); font-size: 20px; letter-spacing: .06em; }
.deckpick span { font-weight: 600; font-size: 14px; line-height: 1.4; }
.frontpick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.frontpick button { display: grid; justify-items: center; gap: 6px; padding: 12px; text-align: center; }
.frontpick img { width: 72px; height: 120px; image-rendering: pixelated; }
.frontpick b { font-family: var(--display); font-size: 18px; }
.frontpick small { font-weight: 600; font-size: 12.5px; line-height: 1.4; color: var(--ink-soft); }
.rules { font-size: 14.5px; line-height: 1.55; }
.rules ul { margin: 6px 0; padding-left: 18px; display: grid; gap: 6px; }
.scraplist { display: flex; flex-wrap: wrap; gap: 8px; }
/* ================= compact battle layout (fits one screen) ================= */
.app.game { max-width: 1440px; height: 100vh; height: 100dvh; padding: 10px 14px; gap: 10px; overflow: hidden;
  grid-template-columns: minmax(0, 1fr) 330px; grid-template-rows: auto minmax(0, 1fr); }
.gbar { grid-column: 1 / -1; gap: 10px; }
.gbar .logo { font-size: 22px; }
.gbar .turnpill { font-size: 14px; padding: 5px 13px; }
button.sm { padding: 6px 11px; font-size: 13px; border-radius: 10px; }
.board { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; }
.board .side { min-height: 0; padding: 8px 10px; gap: 6px; grid-template-rows: auto minmax(0, 1fr); background: var(--panel); border: 1px solid #fff; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,50,120,.12); backdrop-filter: blur(10px); }
.board .side.me { grid-template-rows: minmax(0, 1fr) auto; }
.sidehead { gap: 10px; align-items: center; }
.sidehead h2 { font-size: 14px; }
.sidehead .sub { font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.opcards i { width: 11px; height: 15px; }
.formation { min-height: 0; grid-template-columns: 1fr 1.12fr 1fr; gap: 10px; padding-top: 10px; }
/* robot tiles */
.base { grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 8px 10px 8px 8px; border-radius: 16px; min-height: 0; cursor: pointer; align-items: center; overflow: visible; }
.base:hover { box-shadow: 0 6px 18px rgba(0,50,120,.2); }
.base.peeked { border-color: #ffd23f; }
.base .art { width: 72px; height: 120px; margin: 0; align-self: center; }
.base .bmain { min-width: 0; display: grid; gap: 4px; }
.bhead { gap: 6px; flex-wrap: nowrap; }
.bname { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hprow { margin-top: 0; gap: 6px; }
.hpnum { font-size: 16px; min-width: 40px; }
.hpnum small { font-size: 11px; }
.hp { height: 8px; }
.slotrow { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-height: 26px; }
.slots i { width: 10px; height: 10px; border-width: 2px; border-radius: 3px; }
.pchip { position: relative; width: 26px; height: 26px; border-radius: 8px; display: inline-grid; place-items: center; }
.pchip img { width: 24px; height: 24px; image-rendering: pixelated; }
.pchip.pl { background: var(--pl-bg); } .pchip.sp { background: var(--sp-bg); } .pchip.st { background: var(--st-bg); } .pchip.aq { background: var(--aq-bg); } .pchip.ne { background: var(--ne-bg); }
.pchip i { position: absolute; bottom: -5px; left: 50%; translate: -50% 0; font-style: normal; font-size: 8px; font-weight: 800; padding: 0 3px; border-radius: 4px; background: var(--accent); color: #fff; }
.abl { font-size: 11.5px; font-weight: 600; line-height: 1.35; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.abl b { font-weight: 800; color: var(--ink); }
.abl.off { opacity: .45; }
.abl .tag { display: inline-block; font-size: 9px; letter-spacing: .08em; padding: 1px 5px; border-radius: 5px; margin-right: 4px; color: #fff; background: var(--ink-soft); vertical-align: 1px; }
.abl .tag.FRONT { background: var(--accent); } .abl .tag.SUPPORT { background: #2a9d68; } .abl .tag.ALWAYS { background: #7b3fe4; }
.status { margin-top: 0; gap: 3px; }
.status span { font-size: 9.5px; padding: 2px 5px; border-radius: 5px; }
.down { min-height: 0; height: 100%; border-radius: 16px; font-size: 13px; }
.postag { top: -10px; left: 10px; font-size: 9.5px; padding: 2px 8px; }
.target::after { top: -10px; right: 8px; font-size: 10px; padding: 2px 7px; }
.pop { left: 14px; }
.ticker { display: none; }
/* hand tiles */
.handbar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 6px; min-height: 0; scroll-snap-type: x proximity; }
.tile { position: relative; flex: 0 0 112px; height: 140px; border-radius: 14px; background: var(--card); border: 2px solid var(--line); box-shadow: 0 3px 10px rgba(0,50,120,.14);
  display: grid; grid-template-rows: 64px auto 1fr; justify-items: center; padding: 6px 6px 5px; cursor: pointer; scroll-snap-align: start; transition: transform .12s; overflow: hidden; }
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; }

:root {

  --ne: #b26bff; --ne-bg: #f6efff; --play: #b14cff; --part: #12204a;

-opacity=%220.62%22/%3E%3Cline x1=%221336.9%22 y1=%22120%22 x2=%221336.9%22 y2=%221000%22 stroke-opacity=%220.55%22/%3E%3Cline x1=%221372.8%22 y1=%22120%22 x2=%221372.8%22 y2=%221000%22 stroke-opacity=%220.48%22/%3E%3Cline x1=%221398.9%22 y1=%22120%22 x2=%221398.9%22 y2=%221000%22 stroke-opacity=%220.41%22/%3E%3Cline x1=%221414.7%22 y1=%22120%22 x2=%221414.7%22 y2=%221000%22 stroke-opacity=%220.33%22/%3E%3Cpath d=%22M186 120 Q800 156 1414 120%22 fill=%22none%22/%3E%3Cpath d=%22M186 164 Q800 213 1414 164%22 fill=%22none%22/%3E%3Cpath d=%22M186 224 Q800 286 1414 224%22 fill=%22none%22/%3E%3Cpath d=%22M186 293 Q800 368 1414 293%22 fill=%22none%22/%3E%3Cpath d=%22M186 368 Q800 455 1414 368%22 fill=%22none%22/%3E%3Cpath d=%22M186 448 Q800 548 1414 448%22 fill=%22none%22/%3E%3Cpath d=%22M186 533 Q800 645 1414 533%22 fill=%22none%22/%3E%3Cpath d=%22M186 620 Q800 745 1414 620%22 fill=%22none%22/%3E%3Cpath d=%22M186 711 Q800 849 1414 711%22 fill=%22none%22/%3E%3Cpath d=%22M186 805 Q800 955 1414 805%22 fill=%22none%22/%3E%3Cpath d=%22M186 901 Q800 1064 1414 901%22 fill=%22none%22/%3E%3Cpath d=%22M186 1000 Q800 1176 1414 1000%22 fill=%22none%22/%3E%3C/g%3E%3C/svg%3E") center bottom / cover no-repeat fixed, linear-gradient(180deg, #ffffff 0%, #f2fcff 22%, #b8ecff 48%, #4fb8ff 78%, #0a5cff 100%) fixed; }
/* logo: holo chrome letters + gold star mark */
.logo { font-family: var(--display); font-weight: 700; font-style: italic; letter-spacing: .06em; background: var(--holo); -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1.4px #1b2348; text-shadow: none; position: relative; padding-right: 22px; filter: drop-shadow(2px 2px 0 #1b2348); }
.logo::after { content: ""; position: absolute; right: 0; top: -6px; width: 20px; height: 20px; -webkit-text-stroke: 0;
  background: radial-gradient(circle at 40% 35%, #fff7c2, #ffd000 45%, #ff9a00 100%);
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
/* frames: chunky colored border + inner hairline + top tab */
.panel, .side, .modal { background: rgba(255,255,255,.96); border: 3px solid var(--cyan); border-radius: 10px;
  box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px var(--ice), 0 4px 0 rgba(10,60,180,.12), 0 10px 28px rgba(10,80,200,.14); backdrop-filter: none; }
.modal { border-color: var(--cyan); }
.side { position: relative; }
.side::before, .modal::before { content: ""; position: absolute; top: -3px; left: 50%; translate: -50% 0; width: 70px; height: 7px; background: var(--cyan); border-radius: 0 0 6px 6px; }
.modal { position: relative; }
.sidehead h2, .modal h2, .modal h3 { font-family: var(--display); font-weight: 700; letter-spacing: .05em; }
.sidehead h2 { color: var(--grid-blue); }
/* buttons: chip style */
button { font-family: var(--body); font-weight: 800; border-radius: 8px; border: 2px solid var(--cyan); color: #0b3a8f;
  background: linear-gradient(180deg, #ffffff 0%, #ffffff 48%, #e3f7ff 52%, #f4fcff 100%); box-shadow: 0 3px 0 #9fdcff; transition: transform .08s, box-shadow .08s; }
button:hover:not(:disabled) { filter: none; transform: translateY(-1px); box-shadow: 0 4px 0 #7fd0ff; }
button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #7fd0ff; }
button.primary { color: #fff; border-color: #0a4fe0; background: linear-gradient(180deg, #5ee0ff 0%, #2aa8ff 48%, #0a6dff 52%, #1a8cff 100%); box-shadow: 0 3px 0 #0a3fb8; text-shadow: 0 1px 0 rgba(0,40,120,.4); }
button.primary:hover:not(:disabled) { box-shadow: 0 4px 0 #0a3fb8; }
.turnpill { font-family: var(--display); border-radius: 6px; border: 2px solid var(--cyan); background: #fff; color: var(--ink-soft); box-shadow: 0 3px 0 #9fdcff; }
.turnpill.me { color: #fff; border-color: #0a4fe0; background: linear-gradient(180deg, #5ee0ff, #0a6dff); box-shadow: 0 3px 0 #0a3fb8; }
/* type gem (round, glossy) */
.gem { position: absolute; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; z-index: 2;
  border: 3px solid #fff; box-shadow: 0 0 0 2px currentColor, 0 2px 4px rgba(0,30,90,.25); }
.gem .ti { width: 13px; height: 13px; fill: #fff; filter: drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
.gem.pl { color: var(--pl); background: radial-gradient(circle at 35% 30%, #ffd0c4, #ff5a3c 60%, #c7301a); }
.gem.sp { color: var(--sp); background: radial-gradient(circle at 35% 30%, #fff3b0, #ffb800 60%, #d98400); }
.gem.st { color: var(--st); background: radial-gradient(circle at 35% 30%, #f2f6ff, #8aa0c0 55%, #4b5f7f); }
.gem.aq { color: var(--aq); background: radial-gradient(circle at 35% 30%, #c8f2ff, #18b4ff 60%, #0a5cff); }
.gem.ne { color: var(--ne); background: radial-gradient(circle at 35% 30%, #f0d8ff, #b26bff 60%, #7a2fe0); }
/* robot tiles */
.base { background: #fff; border: 3px solid var(--tc, var(--cyan)); border-radius: 10px; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px var(--tcl, var(--ice)), 0 3px 0 rgba(10,60,180,.12); }
.base.t-pl { --tc: var(--pl); --tcl: #ffd6cc; } .base.t-sp { --tc: var(--sp); --tcl: #ffe9a8; } .base.t-st { --tc: var(--st); --tcl: #d6e0ef; } .base.t-aq { --tc: var(--aq); --tcl: #bfeaff; } .base.t-ne { --tc: var(--ne); --tcl: #e6d3ff; }
.base.front { border-color: var(--tc); box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px var(--tcl), 0 0 0 3px #fff, 0 0 0 6px var(--cyan), 0 6px 18px rgba(10,110,255,.35); }
.base .gem { top: -10px; left: -10px; }
.postag { font-family: var(--display); top: -3px; left: 50%; translate: -50% 0; border-radius: 0 0 7px 7px; border: 0; padding: 1px 10px 2px; background: var(--tc, var(--cyan)); color: #fff; letter-spacing: .14em; }
.front .postag { background: var(--tc); }
/* pod = capsule window with grid + chrome pedestal */
.pod { position: relative; display: grid; place-items: end center; border-radius: 8px; overflow: hidden; padding: 6px 8px 14px;
  background: repeating-linear-gradient(90deg, rgba(56,200,255,.55) 0 1px, transparent 1px 14px), repeating-linear-gradient(0deg, rgba(56,200,255,.55) 0 1px, transparent 1px 14px),
    radial-gradient(ellipse at 50% 55%, #ffffff 0%, #f2fdff 30%, #9fe6ff 62%, #1a8cff 100%);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.8), inset 0 0 18px rgba(10,92,255,.45); }
.pod .art { position: relative; z-index: 1; filter: none; margin: 0; }
.pod .ped { position: absolute; left: 50%; bottom: 4px; translate: -50% 0; width: 76%; height: 14px; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 30%, #ffffff 0%, #dfe6ee 30%, #8b97a6 70%, #4c5563 100%); box-shadow: 0 3px 0 #3a4250, 0 0 0 2px rgba(255,255,255,.7); }
.pod .ped::after { content: ""; position: absolute; inset: 3px 18%; border-radius: 50%; border: 2px solid rgba(255,255,255,.95); }
.base.hit .pod { animation: podhit .35s; }
@keyframes podhit { 30% { box-shadow: inset 0 0 0 2px #fff, inset 0 0 30px rgba(255,60,60,.8); } }
/* two-tone name plate */
.plate { display: flex; align-items: stretch; height: 24px; border-radius: 5px; overflow: hidden; min-width: 0; }
.plate .pd { flex: none; background: var(--plate); color: #fff; padding: 0 14px 0 7px; display: grid; place-items: center; clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 100%, 0 100%); margin-right: -9px; position: relative; z-index: 1; }
.plate .pd .ti { width: 13px; height: 13px; fill: #fff; }

  font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .06em; text-shadow: 0 1px 0 rgba(0,0,0,.25); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hp { background: #e3ebf7; border-radius: 3px; height: 9px; box-shadow: inset 0 0 0 1px rgba(0,40,120,.12); }
.hp i { border-radius: 3px; background: linear-gradient(180deg, #7ff59f, #22c55e); }

.slots i { border-color: var(--tc, var(--cyan)); border-radius: 50%; }
.slots i.on { background: var(--tc, var(--cyan)); }

const costTotal = (c) => c.reduce((s, [, n]) => s + n, 0);
const partValue = (x) => costTotal(x.cost || []) + (x.move ? 2 : 0);

function mkBase(name) { const d = BASES[name]; return { d, hp: d.hp, parts: [], scorch: false, cooled: false, rotIn: false, uid: UID++ }; }

}

const alive = (p) => [0, 1, 2].filter((i) => p.pos[i]);
const hasMove = (b) => !!b.d.stock || b.parts.some((x) => x.move);
const usedSlots = (b) => b.parts.reduce((s, x) => s + x.slots, 0);
const hasPassive = (b, t) => b.parts.some((x) => x.passive === t);
const anyPassive = (p, t) => alive(p).some((j) => hasPassive(p.pos[j], t));
function partsPopped(g, pi) { const p = g.p[pi]; if (g.winner === null && anyPassive(p, "magnet")) { g.log("Scrap Magnet: draw 1."); draw(g, p); } }

// ------------------------------------------------------------------ energy
function canPay(p, cost, disc = 0) {
  const pool = { ...p.pool }; let anyN = 0;
  for (let [k, n] of cost) {
    if (k === "any") { anyN += n; continue; }
    const use = Math.min(pool[k], n); pool[k] -= use; n -= use;
    if (n > 0) { if (disc >= n) disc -= n; else return false; }
  }
  anyN = Math.max(0, anyN - disc);
  return Object.values(pool).reduce((a, b) => a + b, 0) >= anyN;
}
function pay(p, cost, disc = 0, choice = null) {
  let anyN = 0;
  for (let [k, n] of cost) {
    if (k === "any") { anyN += n; continue; }
    const use = Math.min(p.pool[k], n); p.pool[k] -= use; n -= use;
    if (n > 0) disc -= n;
  }
  anyN = Math.max(0, anyN - Math.max(disc, 0));
  if (choice) for (const k of choice) { if (anyN > 0 && p.pool[k] > 0) { p.pool[k]--; anyN--; } }
  while (anyN > 0) { const k = Object.keys(p.pool).reduce((a, b) => (p.pool[b] > p.pool[a] ? b : a)); p.pool[k]--; anyN--; }
}
// how many "any" pips a cost leaves to choose, and from which pool (null if there's no real choice)
function payChoice(p, cost, disc = 0) {
  const pool = { ...p.pool }; let anyN = 0;
  for (let [k, n] of cost) {
    if (k === "any") { anyN += n; continue; }
    const use = Math.min(pool[k], n); pool[k] -= use; n -= use;
    if (n > 0) disc -= n;
  }

// convert embedded data: URIs to blob URLs once (short strings, decoded once, cached)
function toBlobURL(u) {
  if (typeof u !== "string" || !u.startsWith("data:")) return u;
  const [h, b64] = u.split(","), mime = h.slice(5, h.indexOf(";"));
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], { type: mime }));
}

const TKEY = { PL: "PL", ST: "ST", SP: "SP", AQ: "AQ", NE: "NE", PLASMA: "PL", STEEL: "ST", SPARK: "SP", LIQUID: "AQ", NEUTRAL: "NE" };

function splitAbility(t) { t = rich(t); const m = t.match(/^(\w+) · ([^:]+): (.*)$/); return m ? { tag: m[1], name: m[2], desc: m[3] } : { tag: "", name: "", desc: t }; }

let NAME_RE = null;

    NAME_RE = new RegExp(`\\b(${all.join("|")})\\b`, "g");

}
function baseInfoHTML(b, big = true) {
  const B0 = BASES[b], m = B0.stock, ab = splitAbility(B0.text);
  return `<div class="binfo"><div class="spin ${big ? "big" : ""}" data-spin="${b}" style="background-image:url(${SPIN[b]})"></div><div>

    <div class="ab"><span class="lbl">Stock move</span>${m ? `<b>${m.name}</b>${moveText(m)}${m.cost.length ? ` · ${costPips(m.cost)}` : " · free"}` : "<b>None</b>Needs a part to attack."}</div>

// turntable: any .spin inside a hovered element animates
const spinners = new Map();
function spinStart(el) {

  spinners.set(el, setInterval(() => { f = (f + 1) % 16; el.style.backgroundPosition = `${-f * w}px 0`; if (!el.isConnected) spinStop(el); }, 85));
}
function spinStop(el) { clearInterval(spinners.get(el)); spinners.delete(el); if (el.isConnected) el.style.backgroundPosition = "0 0"; }
let edHover = null;

function log(msg, cls = "") {

  msg = rich(linkNames(msg));
  msg = msg.replace(/^You\b/, '<span class="who-you">You</span>').replace(/^AI\b/, '<span class="who-ai">AI</span>');

function fx(uid, amt) { fxq.push({ uid, amt, t: performance.now() }); hits.add(uid); }

// ---------------------------------------------------------------- setup
// ---------------------------------------------------------------- custom deck storage
const STORE = "prototype.customDeck.v1";
function loadCustom() {
  try { const d = JSON.parse(localStorage.getItem(STORE) || "null"); if (d && d.bases && d.list) return d; } catch (e) {}
  return null;
}
function saveCustom(d) { try { localStorage.setItem(STORE, JSON.stringify(d)); } catch (e) {} }
function typesOf(bases) { const t = new Set(bases.map((b) => BASES[b].type)); t.add("NE"); return t; }
const DECK_SIZE = 30, MAX_COPIES = 3;
function deckValid(d) { if (!d || d.bases.length !== 3 || d.list.reduce((s, [, n]) => s + n, 0) !== DECK_SIZE || d.list.some(([, n]) => n > MAX_COPIES)) return false; const t = typesOf(d.bases); return d.list.every(([n]) => CARDS[n] && t.has(CARDS[n].type)); }
function installCustom() {
  const d = loadCustom();
  if (deckValid(d)) DECKS.CUSTOM = { blurb: "Your own build.", bases: d.bases.slice(), list: d.list.map((x) => x.slice()) };
  else delete DECKS.CUSTOM;
}
let setupSel = { me: "IGNITION", ai: "TIDEWALL" };

let setupStep = 1;
function stepper(n) {

}

  $("#overlay").innerHTML = `<div class="overlay"><div class="modal panel setup">
    ${stepper(3)}<div class="steprow"><button class="backbtn" data-cmd="setupback" aria-label="Back to choose your opponent">‹ Back</button><h2>Who starts in front?</h2></div>

function rulesHTML() {
  return `<ul>
  <li><b>Burn or use.</b> Every card can be burned for energy of its type (usually 1), or paid for and used. Energy empties at the end of your turn.</li>
  <li><b>Burn limit:</b> you can burn as many cards as your turn number: 1 on your first turn, 2 on your second, and so on.</li>
  <li><b>Slots:</b> every BASE has a fixed row of slots (the square sockets under its HP). A PART fills 1 to 3 of them and stays until it's popped.</li>
  <li><b>PARTs</b> install on any of your BASEs with enough free slots. Parts with a move let that BASE attack, starting the turn after you install them. Some deal damage or heal when attached.</li>
  <li><b>Paying:</b> when a cost includes "any" energy, you choose which of your energy to spend.</li>
  <li><b>PLAYs</b> are free one-shot effects. Some last until your next turn.</li>
  <li><b>Rotate</b> once per turn for free: swap your FRONT with a support.</li>
  <li><b>Attack</b> with your FRONT's move. CLOSE hits only the enemy FRONT; FAR hits any enemy BASE. Attacking ends your turn.</li>
  <li><b>SYNC:</b> a move part on a robot of the same type hits harder. The colored number on the card is its damage when matched.</li>
  <li><b>NEUTRAL</b> (colorless) cards fit any deck. Their energy only pays "any" costs, and their moves never SYNC.</li>
  <li><b>Decking out:</b> if you have to draw a card and your deck is empty, you lose. Extra-draw cards speed this up, so watch your deck count.</li>
  <li><b>Win</b> by powering down all three enemy BASEs. The first player skips their turn-1 draw.</li></ul>`;
}

function startGame(deck, frontIdx, aiChoice) {
  if (aiWait) { aiWait = null; }
  const starters = ["IGNITION", "TIDEWALL", "FORGE", "CYCLE", "RELAY"];
  const aiDeck = aiChoice === "RANDOM" || !aiChoice ? starters[(Math.random() * starters.length) | 0] : aiChoice;
  logs = []; fxq = []; hits.clear(); if (shell) shell.logN = -1;
  G = { p: [mkPlayer("You", deck, true, frontIdx), mkPlayer("AI", aiDeck, false, 0)], cur: Math.random() < 0.5 ? 0 : 1, turn: 0, winner: null, log, fx };
  for (const p of G.p) {
    for (let i = 0; i < 5; i++) draw(G, p, true);
    if (!p.hand.some((c) => c.def.move)) { p.deck.push(...p.hand); p.hand = []; shuffle(p.deck); for (let i = 0; i < 5; i++) draw(G, p, true); }
  }
  $("#overlay").innerHTML = "";
  log(`Coin flip: ${G.cur === ME ? "you go" : "the AI goes"} first (no draw on turn 1).`, "warn");

}

async function beginTurn() {
  startTurn(G);
  ui = { sel: null, mode: null, move: null };
  if (checkEnd()) return;
  if (G.cur === ME) { log(`Turn ${G.turn + 1} · Your turn`, "sys"); render(); }
  else await aiTurn();
}
function finishTurn() { if (G.winner !== null) return checkEnd(); endTurn(G); beginTurn(); }
function checkEnd() {
  render();
  if (G.winner === null) return false;
  const won = G.winner === ME;
  $("#overlay").innerHTML = `<div class="overlay"><div class="modal panel" style="max-width:460px;text-align:center;justify-items:center">
    <h2>${won ? "Victory!" : "Defeat"}</h2><p>${(() => { const loser = G.p[1 - G.winner], decked = !loser.deck.length && alive(loser).length > 0; return decked ? (won ? "The AI ran out of cards to draw." : "You ran out of cards to draw.") : won ? "All three enemy BASEs are powered down." : "Your last BASE powered down."; })()} The game took ${G.turn + 1} turns.</p>
    <button class="primary" id="again">Play again</button></div></div>`;
  $("#again").onclick = showSetup;
  return true;
}

let aiWait = null;
const aiAuto = () => { try { return localStorage.getItem("prototype.aiAuto") === "1"; } catch (e) { return false; } };
function aiPause(fromLog) {
  if (aiAuto() || G.winner !== null) return sleep(650);
  return new Promise((res) => { aiWait = { res, from: fromLog }; render(); });
}
function aiNext() { if (!aiWait) return; const r = aiWait.res; aiWait = null; render(); r(); }
addEventListener("keydown", (e) => { if (aiWait && (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") && !e.target.closest("input,textarea")) { e.preventDefault(); aiNext(); } });
async function aiTurn() {
  busy = true; log(`Turn ${G.turn + 1} · AI's turn`, "sys"); render();
  await sleep(400);
  let done = false;
  while (!done && G.winner === null) {
    const plan = planTurn(G, 160);
    for (const a of plan) {
      const L = legal(G, G.cur);
      if (!L[a[0]].some((b) => sameAct(a, b))) break;
      const from = logs.length;
      const r = doAction(G, a);
      render(); await aiPause(from);
      if (G.winner !== null || r === "end") { done = true; break; }
      if (a[0] === "play" || a[0] === "rot") break;
    }
  }
  busy = false;
  finishTurn();

// ---------------------------------------------------------------- human actions
function costOf(a) {
  const me = G.p[ME];
  if (a[0] === "attach") return [me.hand[a[1]].def.cost, installDisc(me.pos[a[2]], me, me.hand[a[1]].def)];
  if (a[0] === "rot") return [rotCost(G, ME), 0];
  if (a[0] === "attack") return [moves(G, ME)[a[1]].m.cost, quickDisc(G, ME)];
  return null;
}
function act(a, payPicked) {
  if (!payPicked && !tutAllows(a)) return;
  const c = costOf(a);
  if (c && !payPicked) {
    const ch = payChoice(G.p[ME], c[0], c[1]);
    if (ch) { ui = { ...ui, mode: "pay", pending: a, need: ch.n, avail: ch.pool, picked: [] }; return render(); }
  }
  if (payPicked) a.pay = payPicked;
  const r = doAction(G, a);
  ui = { sel: null, mode: null, move: null };
  if (G.winner !== null) return checkEnd();
  if (r === "end") { render(); setTimeout(finishTurn, 450); return; }
  render();
}


function onMove(mi) {
  if (busy || G.cur !== ME) return;
  const t = attackTargets(G, ME, mi);
  if (!t.length) return;
  if (t.length === 1) return act(["attack", mi, t[0]]);
  ui = { sel: null, mode: "attack", move: mi }; render();
}
function onCmd(cmd) {
  if (cmd === "editor") return openEditor();
  if (cmd === "tutorial") return startTutorial();
  if (cmd === "tofront") return showSetup(3);
  if (cmd === "setupback") return showSetup(Math.max(1, setupStep - 1));
  if (cmd.startsWith("ed:")) return edCmd(cmd.slice(3));
  if (cmd === "new") return showSetup();
  if (cmd === "closepeek") { if (ui.peek) { ui = { ...ui, peek: null }; render(); } return; }
  if (cmd === "openlog") { if (G) { ui = { ...ui, sel: null, peek: { k: "log" } }; render(); } return; }
  if (cmd === "opview") { opFull = !opFull; return render(); }
  if (cmd === "ainext") return aiNext();
  if (cmd === "aiauto") { try { localStorage.setItem("prototype.aiAuto", aiAuto() ? "0" : "1"); } catch (e) {} if (aiAuto() && aiWait) return aiNext(); return render(); }
  if (cmd === "rules" && (!G || document.querySelector("#overlay .setup"))) {
    const back = setupStep;
    $("#overlay").innerHTML = `<div class="overlay"><div class="modal panel"><h2>Quick rules</h2><div class="rules">${rulesHTML()}</div><button class="primary" id="closeR">Back</button></div></div>`;
    $("#closeR").onclick = () => showSetup(back);
    return;
  }
  if (!G || busy || G.cur !== ME) return;
  if (TUT && tutStep() && tutStep().lock && (cmd === "end" || cmd === "rotate")) return tutNudge();
  const me = G.p[ME], c = ui.sel != null ? me.hand[ui.sel] : null;
  if (cmd === "burn") { if (c && c.def.name === "Prism Cell") { ui.mode = "prism"; return render(); } return act(["burn", ui.sel]); }
  if (cmd === "install") { ui.mode = "install"; return render(); }
  if (cmd === "play") {
    if (c.def.effect === "riptide") { ui.mode = "riptide"; return render(); }
    if (c.def.effect === "salvage") { ui.mode = "salvage"; return render(); }
    if (c.def.effect === "scan") { ui.mode = "scan"; return render(); }
    if (c.def.effect === "lowtide") { ui.mode = "lowtide"; return render(); }
    if (c.def.effect === "encore") { ui.mode = "encore"; return render(); }
    if (c.def.effect === "reset") { ui.mode = "reset"; return render(); }
    if (c.def.effect === "feint" && [1, 2].filter((j) => me.pos[j]).length > 1) { ui.mode = "feint"; return render(); }
    if (c.def.effect === "tutor") { ui.mode = "tutor"; ui.disc = []; ui.tpick = null; return render(); }
    return act(["play", ui.sel]);
  }
  if (cmd === "rotate") { ui = { sel: null, mode: "rotate" }; return render(); }
  if (cmd === "cancel") { ui = { sel: null, mode: null, peek: null }; return render(); }
  if (cmd === "paydone") { const a = ui.pending, picked = ui.picked; return act(a, picked); }
  if (cmd === "end") { ui = { sel: null, mode: null }; log("You end your turn."); return finishTurn(); }
  if (cmd === "rules") {
    $("#overlay").innerHTML = `<div class="overlay"><div class="modal panel"><h2>Quick rules</h2><div class="rules">${rulesHTML()}</div><button class="primary" id="closeR">Back to the game</button></div></div>`;
    $("#closeR").onclick = () => ($("#overlay").innerHTML = "");
  }
  if (cmd === "new") showSetup();
}

const myTurnIdle = () => !!G && G.cur === ME && !busy && G.winner === null && (!ui.mode || ui.mode === null);
function slotPips(total, filled = 0, title = "") {

}
// A BASE's slots drawn as a row of sockets: each installed part sits in (and spans) the slots it takes; empty ones are dashed.

  let h = b.parts.map((x) => `<span class="sock full ${TYPES[x.type].cls}" style="--w:${x.slots}" title="${x.name} (${x.slots} slot${x.slots > 1 ? "s" : ""}): ${cardText(x)}"><img src="${CARDART[x.name]}" alt="${x.name}">${x.slots > 1 ? `<em>${x.slots}</em>` : ""}${x.move && x.installedTurn === G.turn ? "<i>NEW</i>" : ""}</span>`).join("");

  return `<div class="slotrow" role="img" aria-label="${used} of ${total} slots filled"><span class="slotlbl ${free ? "" : "full"}"><span>SLOTS</span><b>${used}/${total}</b></span><span class="socks">${h}</span></div>`;
}
function cardHTML(c, i) {

        ? `<span class="sync ${t.cls}" title="On a ${t.name} robot (SYNC +${m.sync ?? 1})">${ICON[d.type]}${m.fx.includes("x") ? "X+" + (m.sync ?? 1) : m.dmg + (m.sync ?? 1)}</span>` : "";
      body += `<div class="mvbox"><span class="lbl">Move · ${m.rng}</span><div class="mvtop"><span class="dmgline"><b>${dmgLabel(m)}</b>${syn}</span><span class="cost">${m.fx.includes("x") ? '<span class="pip free">ALL</span>' : costPips(m.cost)}</span></div>${fx ? `<div>${fx}</div>` : ""}</div>`;

  const list = Object.entries(ed.counts).sort((a, b) => "PLSTSPAQNE".indexOf(CARDS[a[0]].type) - "PLSTSPAQNE".indexOf(CARDS[b[0]].type) || a[0].localeCompare(b[0]))
    .map(([n, k]) => `<div><span class="n">${k}×</span><span class="pip sm ${TYPES[CARDS[n].type].cls}">${ICON[CARDS[n].type]}</span>${n}</div>`).join("") || `<div class="lbl">No cards yet</div>`;
  const fbtn = (k, label) => `<button class="${ed.filter === k ? "on" : ""}" data-cmd="ed:filter|${k}">${label}</button>`;
  $("#overlay").innerHTML = `<div class="overlay"><div class="modal panel wide">
    <h2>Deck editor</h2>
    <div class="ed"><div>
      <h3>Robots · pick 3 <span class="lbl">(first pick is your default front)</span></h3>
      <div class="basegrid">${Object.keys(BASES).map((b) => { const i = ed.bases.indexOf(b), B0 = BASES[b];
        return `<button class="bpick ${i >= 0 ? "on" : ""}" data-cmd="ed:base|${b}" ${i < 0 && ed.bases.length >= 3 ? "disabled" : ""}>${i >= 0 ? `<span class="ord">${i + 1}</span>` : ""}<div class="spin" role="img" aria-label="${b}" style="background-image:url(${SPIN[b]})"></div><b>${b}</b>${typeBadge(B0.type)}<small>${hpBar(B0.hp, B0.hp, "sm")}${slotPips(B0.slots, 0)}</small></button>`; }).join("")}</div>
      <h3 style="margin-top:14px">Cards · up to 3 of each <span class="lbl">(must match one of your robots\' types, or NEUTRAL)</span></h3>
      <div class="filters">${fbtn("ALL", "All")}${fbtn("PL", "Plasma")}${fbtn("ST", "Steel")}${fbtn("SP", "Spark")}${fbtn("AQ", "Liquid")}${fbtn("NE", "Neutral")}${fbtn("PART", "Parts")}${fbtn("PLAY", "Plays")}</div>
      <div class="poolgrid">${names.map(poolCardHTML).join("")}</div>
    </div>
    <aside class="summary">
      <div id="edinfo">${edHover && BASES[edHover] ? baseInfoHTML(edHover) : `<div class="binfo empty">Hover a robot to spin it and read its ability.</div>`}</div>
      <div><span class="lbl">Cards</span><div class="count ${total === DECK_SIZE ? "ok" : ""}">${total} / ${DECK_SIZE}</div></div>
      <div class="typebars">${bars}</div>
      <div><span class="lbl">Robots</span><div>${ed.bases.map((b, i) => `${i + 1}. <b>${b}</b>`).join(" · ") || "none yet"}</div></div>
      <div class="warns">${warns.join("")}</div>
      <div class="dlist">${list}</div>
      <button class="primary" data-cmd="ed:save" ${ed.bases.length === 3 && total === DECK_SIZE && !offCards.length ? "" : "disabled"}>Save deck and play</button>
      <div class="btnrow">${["IGNITION", "TIDEWALL", "FORGE", "CYCLE", "RELAY"].map((n) => `<button data-cmd="ed:start|${n}">${n}</button>`).join("")}</div><span class="lbl">Start from a starter deck</span>
      <div class="btnrow"><button data-cmd="ed:clear">Clear</button><button data-cmd="ed:cancel">Back</button></div>
    </aside></div>
  </div></div>`;
  const nm = document.querySelector('#overlay .modal.wide'); if (nm) nm.scrollTop = keepScroll;
  const no = document.querySelector('#overlay .overlay'); if (no) no.scrollTop = keepOv;
  if (focusCmd) { const f = document.querySelector(`#overlay [data-cmd="${CSS.escape(focusCmd)}"]`); if (f && !f.disabled) f.focus({ preventScroll: true }); }
  if (edHover) spinStart(document.querySelector('#edinfo .spin'));
}
showSetup();
</script>
<div id="tip" aria-hidden="true"></div>
</body>
</html>
